# Gardes du socle commun Memnius (A2 à A7) et index du registre, maintenus dans le dépôt registre de l'organisation.
# Le ruleset de main exige que ce contrôle soit vert avant toute fusion (garde A1).
name: Memnius
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read       # après la fusion, la CI pousse l'index du registre avec la clé de déploiement du projet (environnement index)
jobs:
  gardes:
    uses: Memnius-PEE/registre/.github/workflows/gardes.yml@v2
    secrets: inherit
