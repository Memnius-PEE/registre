# Workflow réutilisable : gardes du socle, appelées par chaque projet
#   on: [pull_request, push sur main]
#   permissions: {contents: read}
#   jobs:
#     gardes:
#       uses: Memnius-PEE/registre/.github/workflows/gardes.yml@v2
#       secrets: inherit
# Bloque la fusion si le socle n'est pas respecté (le ruleset du projet exige ce contrôle, garde A1).
# Sur une pull request du dépôt lui-même, écrit aussi l'index du registre (règle C11) et le commite sur la
# branche de la pull request. Il pousse avec la clé de déploiement du projet (secret MEMNIUS_INDEX_CLE, posé par
# publier-projet.sh) : un tel commit déclenche une nouvelle exécution pull_request, dont le contrôle compte pour
# le ruleset. Poussé avec le jeton du workflow, il resterait « en attente d'approbation » et la relance par
# workflow_dispatch ne compte pas pour le ruleset : sans la clé, la CI ne commite donc rien et demande l'index.
name: Gardes Memnius
on:
  workflow_call:
    inputs:
      socle:
        description: Étiquette du socle (dépôt registre de l'organisation)
        type: string
        default: v2
    secrets:
      MEMNIUS_INDEX_CLE:
        description: Clé privée de la clé de déploiement en écriture du projet (commit de l'index, règle C11)
        required: false

permissions:
  contents: read

jobs:
  gardes:
    name: Gardes A2 à A7
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # A4 compare le journal au commit de base
          lfs: false       # A6 lit la taille réelle dans les pointeurs LFS
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pyyaml jsonschema
      - name: Outils communs
        run: git clone --quiet --depth 1 --branch "${{ inputs.socle }}" "https://github.com/${{ github.repository_owner }}/registre.git" /tmp/registre-commun
      - name: Gardes
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          PRINCIPALE: ${{ github.event.repository.default_branch }}
        run: |
          # Relance après le commit de l'index : pas de base dans l'événement, on prend le point de départ de la branche.
          if [ -z "$BASE" ]; then BASE=$(git merge-base "origin/$PRINCIPALE" HEAD); fi
          python3 /tmp/registre-commun/outils/gardes.py --base "$BASE" .

  index:
    name: Index du registre (C11)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Clé de déploiement présente ?
        id: cle
        env:
          CLE: ${{ secrets.MEMNIUS_INDEX_CLE }}
        run: echo "presente=$([ -n "$CLE" ] && echo oui || echo non)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ssh-key: ${{ steps.cle.outputs.presente == 'oui' && github.event.pull_request.head.repo.full_name == github.repository && secrets.MEMNIUS_INDEX_CLE || '' }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pyyaml jsonschema
      - name: Outils communs
        run: git clone --quiet --depth 1 --branch "${{ inputs.socle }}" "https://github.com/${{ github.repository_owner }}/registre.git" /tmp/registre-commun
      - name: Régénérer l'index et les blocs de liens
        run: python3 /tmp/registre-commun/outils/memnius.py index .
      - name: Commiter sur la pull request
        env:
          BRANCHE: ${{ github.event.pull_request.head.ref }}
          SOURCE: ${{ github.event.pull_request.head.repo.full_name }}
          CLE: ${{ steps.cle.outputs.presente }}
        run: |
          git add -A registre
          if git diff --cached --quiet; then echo "index déjà à jour"; exit 0; fi
          if [ "$SOURCE" != "${{ github.repository }}" ]; then
            echo "::warning::pull request venant d'une copie : index non commité, la prochaine pull request du dépôt le mettra à jour"
            exit 0
          fi
          if [ "$CLE" != oui ]; then
            echo "::error::index du registre périmé et pas de secret MEMNIUS_INDEX_CLE : lancer « memnius.py index . » et commiter, ou poser la clé (publier-projet.sh --regler)"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --quiet -m "Index du registre régénéré par la CI (règle C11)"
          git push --quiet origin "HEAD:$BRANCHE"
          echo "index commité : les gardes repassent sur ce commit"

  secrets:
    name: A2, second filet (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          docker run --rm -v "$PWD:/depot" ghcr.io/gitleaks/gitleaks:v8.18.4 \
            detect --source /depot --no-banner --redact --verbose --log-opts="${BASE:+$BASE..}HEAD"
