# Workflow réutilisable : gardes du socle, appelées par chaque projet
#   on: [pull_request, push sur main]
#   permissions: {contents: read}
#   jobs:
#     gardes:
#       uses: Memnius-PEE/registre/.github/workflows/gardes.yml@v2
#       secrets: inherit
# Bloque la fusion si le socle n'est pas respecté (le ruleset du projet exige les contrôles « gardes » et
# « gitleaks », garde A1).
# Après chaque fusion (push sur main), écrit aussi l'index du registre et les blocs de liens des cartes (règle
# C11, décision 0021) et les pousse sur main avec la clé de déploiement du projet, dispensée du ruleset. Une pull
# request ne touche donc jamais l'index : pas de conflit entre deux pull requests, et une pull request venue
# d'une copie (fork) est indexée comme les autres. La clé privée est le secret MEMNIUS_INDEX_CLE de
# l'environnement « index » du projet, réservé à main (publier-projet.sh le crée) : une branche ne peut pas la lire.
name: Gardes Memnius
on:
  workflow_call:
    inputs:
      socle:
        description: Étiquette du socle (dépôt registre de l'organisation)
        type: string
        default: v2

permissions:
  contents: read

jobs:
  gardes:
    name: Gardes A2 à A7
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # A4 compare le journal au commit de base
          lfs: false       # A6 lit la taille réelle dans les pointeurs LFS
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pyyaml==6.0.2 jsonschema==4.23.0
      - name: Outils communs
        run: git clone --quiet --depth 1 --branch "${{ inputs.socle }}" "https://github.com/${{ github.repository_owner }}/registre.git" /tmp/registre-commun
      - name: Gardes
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          PRINCIPALE: ${{ github.event.repository.default_branch }}
        run: |
          # Sans base dans l'événement (lancement à la main), on prend le point de départ de la branche.
          if [ -z "$BASE" ]; then BASE=$(git merge-base "origin/$PRINCIPALE" HEAD); fi
          set +e
          python3 /tmp/registre-commun/outils/gardes.py --base "$BASE" . | tee /tmp/bilan.txt
          code=${PIPESTATUS[0]}
          # Le bilan s'affiche aussi sur la page de l'exécution, sans ouvrir le journal.
          { echo "### Gardes du socle Memnius"; echo; echo '```'; cat /tmp/bilan.txt; echo '```'
            [ "$code" = 0 ] || echo "Chaque ligne [FIRE] dit quoi corriger ; voir REGLES.md du dépôt registre."; } >> "$GITHUB_STEP_SUMMARY"
          exit "$code"

  index:
    name: Index du registre (C11)
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment: index
    concurrency: index-${{ github.repository }}
    steps:
      - name: Clé de déploiement présente ?
        id: cle
        env:
          CLE: ${{ secrets.MEMNIUS_INDEX_CLE }}
        run: echo "presente=$([ -n "$CLE" ] && echo oui || echo non)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          ssh-key: ${{ secrets.MEMNIUS_INDEX_CLE }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pyyaml==6.0.2 jsonschema==4.23.0
      - name: Outils communs
        run: git clone --quiet --depth 1 --branch "${{ inputs.socle }}" "https://github.com/${{ github.repository_owner }}/registre.git" /tmp/registre-commun
      - name: Régénérer l'index et le pousser sur la branche principale
        env:
          BRANCHE: ${{ github.event.repository.default_branch }}
          CLE: ${{ steps.cle.outputs.presente }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Une autre fusion peut arriver entre-temps : on repart alors de la nouvelle tête, trois fois au plus.
          for essai in 1 2 3; do
            git fetch --quiet origin "$BRANCHE" && git reset --quiet --hard "origin/$BRANCHE"
            python3 /tmp/registre-commun/outils/memnius.py index .
            git add -A registre
            if git diff --cached --quiet; then echo "index déjà à jour"; exit 0; fi
            if [ "$CLE" != oui ]; then
              echo "::error::index du registre périmé et pas de secret MEMNIUS_INDEX_CLE dans l'environnement « index » : lancer publier-projet.sh NOM --regler"
              exit 1
            fi
            git commit --quiet -m "Index du registre régénéré par la CI (règle C11)"
            if git push --quiet origin "HEAD:$BRANCHE"; then echo "index poussé sur $BRANCHE"; exit 0; fi
            echo "poussée refusée (essai $essai) : nouvelle tentative"
          done
          echo "::error::index non poussé après trois essais"
          exit 1

  secrets:
    name: A2, second filet (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          docker run --rm -v "$PWD:/depot" ghcr.io/gitleaks/gitleaks:v8.18.4 \
            detect --source /depot --no-banner --redact --verbose --log-opts="${BASE:+$BASE..}HEAD"
